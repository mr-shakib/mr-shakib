name: 3D Profile Contribution Graph

on:
  schedule:
    # Runs every day at 00:00 UTC — adjust as you like
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.9.1
        env:
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Update 3D contribution graph" || echo "No changes to commit"
          git push
